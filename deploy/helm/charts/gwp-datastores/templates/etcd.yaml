{{- if .Values.etcd.enabled }}
{{- $name := printf "%s-etcd" (include "gwp-datastores.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "gwp-datastores.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: client
      port: 2379
      targetPort: client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "gwp-datastores.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      containers:
        - name: etcd
          image: "{{ .Values.etcd.image.repository }}:{{ .Values.etcd.image.tag }}"
          imagePullPolicy: {{ .Values.etcd.image.pullPolicy }}
          command:
            - etcd
          args:
            - --data-dir=/var/lib/etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://{{ $name }}:2379
            - --auto-compaction-mode=periodic
            - --auto-compaction-retention=1h
            - --auto-compaction-interval=1h
          ports:
            - name: client
              containerPort: 2379
          readinessProbe:
            exec:
              command: [etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
          livenessProbe:
            exec:
              command: [etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.etcd.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
