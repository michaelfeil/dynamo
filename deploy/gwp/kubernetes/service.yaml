apiVersion: v1
kind: Service
metadata:
  name: dynamo-gwp
  labels:
    app.kubernetes.io/name: dynamo-gwp
    app.kubernetes.io/component: global-workload-plane
spec:
  selector:
    app.kubernetes.io/name: dynamo-gwp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    - name: envoy-metrics
      port: 9902
      targetPort: envoy-metrics
      protocol: TCP
