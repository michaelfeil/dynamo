# Prometheus Operator ServiceMonitor for GWP and read-only Envoy metrics. Requires the
# monitoring.coreos.com/v1 CRD (prometheus-operator). The pod-template
# prometheus.io/scrape annotations in deployment.yaml remain as a fallback
# for vanilla Prometheus deployments; this ServiceMonitor takes precedence on
# clusters running prometheus-operator. Drop this file from the kustomization
# if the CRD is not installed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dynamo-gwp
  labels:
    app.kubernetes.io/name: dynamo-gwp
    app.kubernetes.io/component: global-workload-plane
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamo-gwp
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scheme: http
    - port: envoy-metrics
      path: /stats/prometheus
      interval: 15s
      scheme: http
