apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-gwp
data:
  # Router-replica discovery. Session affinity uses Redis (below).
  etcd-endpoints: http://gwp-stores-gwp-datastores-etcd.gwp.svc.cluster.local:2379
  # "zmq" (direct pod-to-pod) or "nats" (NATS Core pub-sub).
  event-plane: zmq
  nats-server: nats://gwp-stores-gwp-datastores-nats.gwp.svc.cluster.local:4222
  b10-router.yaml: |
    b10_routing_config:
      # Only non-overridable fields; scoring weights live in gwp.yaml load_balancing.
      router_cache_miss_min_isl: 40096
      router_prefill_token_discount: 0.2
  gwp.yaml: |
    endpoints:
      prod-fast:
        ingress_url: http://composer-2-5-dyn12v2-fast.dynamo.svc.cluster.local/v1
        planner_url: http://composer-2-5-dyn12v2-fast-plv2.dynamo.svc.cluster.local/deep/health
      prod-alt-fast:
        ingress_url: http://composer-2-5-dyn12v2-alt-fast.dynamo.svc.cluster.local/v1
        planner_url: http://composer-2-5-dyn12v2-alt-fast-plv2.dynamo.svc.cluster.local/deep/health
    routes:
      - models:
          - composer-2-5
        endpoints:
          - prod-fast
          - prod-alt-fast
    served_alias_model_map:
      composer-2-5-08-preview: composer-2-5
      composer-2-5-fast: composer-2-5
      composer-2-5-alt: composer-2-5
      composer-2-5-fast-alt: composer-2-5
      composer-2-5-alt-fast: composer-2-5
    session:
      ttl_secs: 1800
      prompt_hash_fallback:
        token_position: 100000
      # Must use Redis; etcd is reserved for router-replica discovery.
      backend:
        type: redis
        url: redis://gwp-stores-gwp-datastores-redis.gwp.svc.cluster.local:6379/
        key_prefix: "gwp:affinity:"
    routing:
      pseudo_stride: 4
      block_size: 32
      planner_staleness_grace_secs: 30
      replica_warmup_secs: 90
      shutdown_grace_secs: 30
      approx_indexer_ttl_secs: 120
    # Precedence: models.<canonical>.load_balancing > default.load_balancing > b10-router.yaml > hardcoded
    model_policies:
      default:
        affinity: true
        trie: true
        load_balancing:
          planner_weight: 1.0          # GWP-only (planner↔local fusion)
          local_weight: 1.0            # GWP-only (planner↔local fusion)
          prefill_weight: 2.5
          decode_weight: 1.0
          active_request_weight: 10.0
          cache_miss_weight: 0.02
          temperature: 0.20
      # Per-model override: only list fields you want to change.
      # models:
      #   composer-2-5:
      #     load_balancing:
      #       active_request_weight: 15.0
      models: {}
