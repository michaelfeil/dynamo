apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-gwp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamo-gwp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamo-gwp
        app.kubernetes.io/component: global-workload-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: dynamo-gwp
      containers:
        - name: gwp
          image: dynamo-gwp:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DYN_LOG
              value: info,dynamo_llm::kv_router::b10_worker_selector=warn
            - name: DYN_GWP_CONFIG_PATH
              value: /configs/gwp.yaml
            - name: DYN_LLMAPI_CONFIG_PATH
              value: /configs/b10-router.yaml
            - name: DYN_GWP_GRPC_PORT
              value: "8091"
            - name: DYN_SYSTEM_HOST
              value: 0.0.0.0
            - name: DYN_SYSTEM_PORT
              value: "9090"
            - name: ETCD_ENDPOINTS
              valueFrom:
                configMapKeyRef:
                  name: dynamo-gwp
                  key: etcd-endpoints
          ports:
            - name: schedule-grpc
              containerPort: 8091
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            grpc:
              port: 8091
              service: gwp-liveness
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            grpc:
              port: 8091
              service: gwp-readiness
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            grpc:
              port: 8091
              service: gwp-liveness
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
            limits:
              cpu: "8"
              memory: 40Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: gwp-config
              mountPath: /configs
              readOnly: true

        - name: envoy
          # Envoy v1.39.0 plus the immutable Rust Proxy-Wasm GWP filter.
          image: dynamo-gwp-envoy:wasm-poc-amd64
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          args:
            - -c
            - /workspace/deploy/gwp/poc/envoy.yaml
            - --log-level
            - info
            # Envoy's cgroup CPU detection reports the 128-core node in this
            # environment instead of the container's four-core limit. Pin the
            # worker count to the maximum CPU actually available to Envoy.
            - --concurrency
            - "4"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: envoy-metrics
              containerPort: 9902
              protocol: TCP
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: envoy-config
              mountPath: /workspace/deploy/gwp/poc
              readOnly: true
            - name: envoy-tmp
              mountPath: /tmp

      volumes:
        - name: gwp-config
          configMap:
            name: dynamo-gwp
            items:
              - key: gwp.yaml
                path: gwp.yaml
              - key: b10-router.yaml
                path: b10-router.yaml
        - name: envoy-config
          configMap:
            name: dynamo-gwp-envoy
        - name: envoy-tmp
          emptyDir: {}
