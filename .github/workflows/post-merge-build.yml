name: Post-Merge Build (framework=none)

on:
  push:
    branches:
      - main-v1.2.0

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: depot-ubuntu-24.04-64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        run: |
          ./container/build.sh --framework none --push
