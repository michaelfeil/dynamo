name: Post-Merge Build (framework=none)

on:
  workflow_dispatch:
  push:
    branches:
      - main-v1.2.0 # add whatever branch is main for this, consider in future upstreams 1.3 etc.

permissions:
  contents: read

# The image tag is deterministic from the commit (.version-base + short sha), so
# every job computes it locally instead of waiting on a shared resolve job — a
# dedicated job cost a full runner boot (~2.5 min) of serial latency before the
# builds could start. The sha abbreviation is pinned to 9 hex chars so all jobs
# agree regardless of checkout depth (git's auto length depends on local object
# count and would diverge between full and shallow clones).

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: depot-ubuntu-24.04-64
          - arch: arm64
            platform: linux/arm64
            runner: depot-ubuntu-24.04-arm-64
    name: Build and push ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full commit history + tags are required: build.sh derives the version
          # from `git describe`/`git tag`, and tools/version-stamp.sh counts
          # commits in `v1.2.0..HEAD`. `filter: blob:none` keeps the whole commit
          # graph while fetching file blobs lazily, so checkout stays light.
          fetch-depth: 0
          filter: blob:none
      - name: Resolve image tag
        id: tags
        run: |
          version_base="$(tr -d '[:space:]' < .version-base)"
          version_base="${version_base#v}"
          short_sha="$(git rev-parse --short=9 HEAD)"
          image_tag="baseten/dynamo-test:v${version_base}.dev.${short_sha}-none"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${image_tag}"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Depot builder
        # Persistent BuildKit cache (layers + cargo --mount=type=cache dirs)
        # across runs. The per-arch matrix is kept because container/build.sh
        # passes per-arch build args (ARCH/ARCH_ALT), which a single
        # multi-platform invocation wouldn't resolve correctly.
        uses: depot/use-action@v1
        with:
          project: ${{ secrets.DEPOT_DYNAMO_CI_PROJECT_ID }}
          token: ${{ secrets.DEPOT_DYNAMO_CI_PROJECT_TOKEN }}
      - name: Build and push
        env:
          # Keep each per-arch push a plain single-platform manifest so the
          # imagetools stitch below produces a clean two-entry manifest list
          # (no provenance/SBOM attestation indexes).
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          image_tag="${{ steps.tags.outputs.image_tag }}"
          arch_image_tag="${image_tag}-${{ matrix.arch }}"

          # Rust compilation cache: sccache → Depot Cache (WebDAV). Depot-managed
          # runners inject SCCACHE_WEBDAV_TOKEN into the environment automatically;
          # no repo secrets required. Warn loudly rather than silently building cold.
          #
          # Always use the public endpoint, NOT the runner's SCCACHE_WEBDAV_ENDPOINT:
          # the runner injects a runner-local cache proxy that is unreachable from
          # the remote Depot builders where the build actually executes.
          SCCACHE_ARGS=()
          if [ -n "${SCCACHE_WEBDAV_TOKEN:-}" ]; then
            echo "sccache: ENABLED (webdav endpoint=https://cache.depot.dev)"
            SCCACHE_ARGS=(
              --use-sccache
              --sccache-webdav-endpoint "https://cache.depot.dev"
            )
          else
            echo "::warning title=sccache disabled::SCCACHE_WEBDAV_TOKEN not present in the runner environment — Rust compiles will run uncached."
          fi

          # --target runtime: consumers only need the runtime env + /opt/dynamo
          # wheelhouse; the dev target's tooling stages are dead weight here.
          ./container/build.sh --framework none \
            --target runtime \
            --platform "${{ matrix.platform }}" \
            --tag "${arch_image_tag}" \
            --no-tag-latest \
            --push \
            "${SCCACHE_ARGS[@]}"

  publish-multi-arch-image:
    needs:
      - build-and-push
    runs-on: depot-ubuntu-24.04-64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Depth-1 is enough here: only .version-base and HEAD's sha are needed,
        # and the abbreviation length is pinned (see note at the top).
      - name: Resolve image tag
        id: tags
        run: |
          version_base="$(tr -d '[:space:]' < .version-base)"
          version_base="${version_base#v}"
          short_sha="$(git rev-parse --short=9 HEAD)"
          image_tag="baseten/dynamo-test:v${version_base}.dev.${short_sha}-none"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${image_tag}"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push multi-arch manifest
        run: |
          image_tag="${{ steps.tags.outputs.image_tag }}"

          docker buildx imagetools create \
            --tag "${image_tag}" \
            "${image_tag}-amd64" \
            "${image_tag}-arm64"
