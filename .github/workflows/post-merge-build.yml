name: Post-Merge Build (framework=none)

on:
  workflow_dispatch:
  push:
    branches:
      - main-v1.2.0 # add whatever branch is main for this, consider in future upstreams 1.3 etc.

permissions:
  contents: read

# The post-merge build is the same pipeline as the dispatched bis image push
# (same builders, caches, tag scheme, publish job), so this workflow is just a
# thin caller: build the triggering commit and push to the default image repo.

jobs:
  build-and-publish:
    uses: ./.github/workflows/bis-dynamo-image-push.yml
    secrets: inherit
