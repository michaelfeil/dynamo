name: Post-Merge Build (framework=none)

on:
  workflow_dispatch:
  push:
    branches:
      - main-v1.2.0 # add whatever branch is main for this, consider in future upstreams 1.3 etc.

permissions:
  contents: read

jobs:
  resolve-image-tag:
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
    runs-on: depot-ubuntu-24.04-64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve image tag
        id: tags
        run: |
          version_base="$(tr -d '[:space:]' < .version-base)"
          version_base="${version_base#v}"
          short_sha="$(git rev-parse --short HEAD)"
          image_tag="baseten/dynamo-test:v${version_base}.dev.${short_sha}-none"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: resolve-image-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: depot-ubuntu-24.04-64
          - arch: arm64
            platform: linux/arm64
            runner: depot-ubuntu-24.04-arm-64
    name: Build and push ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        run: |
          image_tag="${{ needs.resolve-image-tag.outputs.image_tag }}"
          arch_image_tag="${image_tag}-${{ matrix.arch }}"

          ./container/build.sh --framework none \
            --platform "${{ matrix.platform }}" \
            --tag "${arch_image_tag}" \
            --no-tag-latest \
            --push

  publish-multi-arch-image:
    needs:
      - resolve-image-tag
      - build-and-push
    runs-on: depot-ubuntu-24.04-64
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push multi-arch manifest
        run: |
          image_tag="${{ needs.resolve-image-tag.outputs.image_tag }}"

          docker buildx imagetools create \
            --tag "${image_tag}" \
            "${image_tag}-amd64" \
            "${image_tag}-arm64"
