name: BIS Dynamo Image Push

# Dispatchable build+push of the Dynamo runtime image for the bis-deploy
# service. The caller passes a branch; the workflow checks it out, builds+pushes
# via the repo's standard `container/build.sh --framework none --push` (cf.
# post-merge-build.yml) — using build.sh's default version-stamped tag
# (e.g. baseten/dynamo-test:v1.2.0.dev.<sha>-none) — and publishes that exact
# resolved ref as the `image-tag` artifact. The run-name carries `(prefix=…)`
# so bis-deploy can correlate the dispatched run.

run-name: "Dynamo image @ ${{ inputs.ref || github.ref_name }} (prefix=${{ inputs.image-tag-prefix }})"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch (or ref) to build."
        type: string
        default: ""
      image-tag-prefix:
        description: "Correlation prefix for the run name (bis-deploy injects bis-<hex>)."
        type: string
        default: ""
      notify-on-failure:
        description: "Post to #mp-ci-alerts on failure (needs MP_CI_SLACK_WEBHOOK_URL)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push:
    name: Build and push Dynamo image
    runs-on: depot-ubuntu-24.04-64
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          # Full commit history + tags are required: build.sh derives the version
          # from `git describe`/`git tag`, and tools/version-stamp.sh counts commits
          # in `v1.2.0..HEAD`. `filter: blob:none` keeps the whole commit graph while
          # fetching file blobs lazily, so checkout is far lighter than a full clone.
          fetch-depth: 0
          filter: blob:none
          # LFS media (test fixtures) are not needed to build the image; skipping the
          # LFS pull removes a large, slow download from every run.
          lfs: 'false'

      - name: Set up Docker Buildx
        # docker-container driver (vs the default "docker" driver) is required to
        # export a registry-backed layer cache via --cache-to type=registry.
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        env:
          # Keep the pushed image a plain single-platform manifest (as the default
          # "docker" driver produced before we switched to docker-container for cache
          # export). Without this, buildx adds provenance/SBOM attestations and pushes
          # an OCI image index — extra work, and a manifest shape the downstream
          # `COPY --from=<dynamo image>` consumers don't expect.
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
          # Registry layer cache lives in the same Docker Hub repo we push to (reuses
          # the DOCKER_* creds above). Override-able via the image-repo input.
          CACHE_REF: ${{ inputs.image-repo }}:buildcache
          # sccache (S3) is optional: wired only when these org secrets are visible to
          # the run, so the workflow still succeeds without them (just slower cold builds).
          SCCACHE_S3_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail

          # Registry-backed BuildKit cache. mode=max also caches the intermediate
          # wheel-builder stages (where the Rust + native-lib compiles happen), which
          # is what lets cold (source-changed) rebuilds reuse every unchanged layer and
          # warm rebuilds finish near-instantly. image-manifest/oci-mediatypes are
          # required for Docker Hub to accept the cache manifest.
          CACHE_ARGS=(
            --cache-from "type=registry,ref=${CACHE_REF}"
            --cache-to   "type=registry,ref=${CACHE_REF},mode=max,image-manifest=true,oci-mediatypes=true"
          )

          # Rust compilation cache (sccache → S3). Persists compiled objects across
          # runs and across the runtime/kvbm wheel builds, so changing one core Rust
          # file no longer forces a full recompile from scratch.
          SCCACHE_ARGS=()
          if [ -n "${SCCACHE_S3_BUCKET}" ] && [ -n "${AWS_ACCESS_KEY_ID}" ]; then
            echo "sccache: ENABLED (bucket=${SCCACHE_S3_BUCKET}, region=${AWS_DEFAULT_REGION:-us-east-1})"
            SCCACHE_ARGS=(
              --use-sccache
              --sccache-bucket "${SCCACHE_S3_BUCKET}"
              --sccache-region "${AWS_DEFAULT_REGION:-us-east-1}"
            )
          else
            echo "sccache: DISABLED (SCCACHE_S3_BUCKET / AWS credentials not available to this run)"
          fi

          ./container/build.sh --framework none --push \
            "${CACHE_ARGS[@]}" "${SCCACHE_ARGS[@]}" 2>&1 | tee build.log

      - name: Publish image-tag artifact
        run: |
          set -euo pipefail
          # build.sh prints `Building Dynamo Image: '<TAG>'` — capture that exact
          # default version-stamped tag so the artifact matches what was pushed.
          ref="$(sed -n "s/.*Building Dynamo Image: '\(.*\)'.*/\1/p" build.log | head -1)"
          if [ -z "$ref" ]; then
            echo "::error::could not resolve the built image tag from build.log"; exit 1
          fi
          echo -n "$ref" > image-tag.txt
          echo "Resolved image ref: $ref"

      - name: Upload tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image-tag.txt
          if-no-files-found: error

      - name: Notify Slack on failure
        if: failure() && inputs.notify-on-failure
        continue-on-error: true
        uses: basetenlabs/action-slack@v3.0.0
        with:
          status: custom
          fields: workflow,job,commit,repo,ref,author,took
          custom_payload: |
            {
              "attachments": [{
                "color": "danger",
                "text": "❌ Dynamo image push failed on `${{ github.ref_name }}` @ `${{ github.sha }}`.\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> · triggered by `${{ github.actor }}`"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.MP_CI_SLACK_WEBHOOK_URL }}
