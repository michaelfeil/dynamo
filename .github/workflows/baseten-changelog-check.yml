name: Baseten Changelog Check

on:
  pull_request:
    branches:
      - main-v1.2.0
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  changelog-updated:
    name: baseten-changelog.md updated
    runs-on: ubuntu-latest
    steps:
      - name: Check for skip label
        id: skip
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const skip = labels.includes('skip-changelog');
            core.setOutput('skip', skip ? 'true' : 'false');
            if (skip) {
              core.info('skip-changelog label present; skipping check.');
            }

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseten-changelog.md was modified
        if: steps.skip.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" "$HEAD_SHA" --depth=1 || true
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'baseten-changelog.md'; then
            echo "baseten-changelog.md was updated."
            exit 0
          fi
          echo "::error::This PR targets main-v1.2.0 but does not modify baseten-changelog.md."
          echo "If the change truly does not need a changelog entry, add the 'skip-changelog' label to the PR."
          exit 1
