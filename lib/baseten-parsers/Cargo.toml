[package]
name = "baseten-parsers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Request-scoped Baseten adapters for upstream Dynamo streaming parsers"

[dependencies]
anyhow.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
dynamo-parsers-v1 = { package = "dynamo-parsers", version = "=9.1.0", git = "https://github.com/michaelfeil/frontend-crates.git", rev = "3316a4dc2a0752297de91714b13b7586931c5926" }
vllm-parser = { git = "https://github.com/vllm-project/vllm.git", rev = "f84325c48c0acc1e3703103788c5f2976e719762" }
vllm-tokenizer = { git = "https://github.com/vllm-project/vllm.git", rev = "f84325c48c0acc1e3703103788c5f2976e719762" }
dynamo-parsers-v2 = { version = "=0.7.3", git = "https://github.com/michaelfeil/frontend-crates.git", rev = "3316a4dc2a0752297de91714b13b7586931c5926" }

[dev-dependencies]
serde_json.workspace = true
