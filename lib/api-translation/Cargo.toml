[package]
name = "b10-dynamo-api-translation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared Chat Completions normalization: Anthropic Messages / OpenAI Responses ingress to CC, and CC-chunk egress framing back to each protocol. Ported from tool-bank's api_translation; CC + baseten_ext is the canonical contract."

[features]
# Compiles the render-equivalence oracle (`dynamo_conformance_tests/oai.rs`) against the
# in-workspace `dynamo-renderer`. Off by default: the fast test path never loads minijinja.
render-conformance = []

[dependencies]
dynamo-protocols = { workspace = true }

http = "1"
serde = { workspace = true }
# preserve_order: forwarded request JSON keeps the client's field order
# (turn-stable passthrough bytes).
serde_json = { workspace = true, features = ["preserve_order"] }
# Names the offending JSON member in a rejection: serde omits it, and an untagged
# enum discards the inner error entirely.
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
# SseFrameTx is a tokio mpsc sender; nothing else async lives here. An
# independent requirement (not workspace-inherited): the workspace pins
# `=1.48.0`, and inheriting it would force that exact pin onto every git-dep
# consumer's resolution (tool-bank hit this).
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# Render-conformance oracle (feature `render-conformance`); test-only, never linked in prod.
dynamo-renderer = { workspace = true }
minijinja = "2.20.0"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[package.metadata.docs.rs]
all-features = true
